[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vprune"
version = "0.1.0"
description = "Training-free visual-only selection, position preservation, and token recycling for FastVLM"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "transformers==4.48.3",
  "timm==1.0.15", "accelerate==1.6.0", "numpy==1.26.4", "Pillow>=10,<13",
]

[project.scripts]
vprune = "vprune.cli:main"

[tool.setuptools.packages.find]
include = ["vprune*"]
